<title>It Girl Planner</title>
<style>
:root{

}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-weight:400} b,strong{font-weight:bold} em,i{font-style:italic}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #c98b99;outline-offset:2px}
.app{min-height:100vh;display:flex}.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:var(--panel);border-right:1px solid var(--line);padding:28px 16px;z-index:20}.brand{font-family:Georgia,serif;font-size:25px;line-height:1.05;padding:8px 10px 34px;letter-spacing:.02em}.brand span{color:var(--accent)}
.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#62595b;text-align:left;padding:11px 12px;border-radius:12px;font-size:14px}.nav button:hover{background:#f4ece9}.nav button.active{background:var(--accent-soft);color:var(--accent)}
.main{margin-left:220px;width:calc(100% - 220px);padding:38px 48px 64px}.page{max-width:1120px;margin:0 auto}.page-head{margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}.title{font-family:Georgia,serif;font-weight:400;font-size:36px;line-height:1.08;margin:0;letter-spacing:-.01em}.date{font-size:13px;color:var(--muted);margin-top:9px}.quote{font-family:Georgia,serif;font-style:normal;font-weight:400;font-size:15px;line-height:1.45;color:#62585a;margin:15px 0 0;max-width:690px}.quote button{margin-left:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:none}.card h2{font-family:Georgia,serif;font-weight:400;font-size:18px;margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.section{margin-top:14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted)}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.score-card{min-height:168px;display:block}.score-number{font-family:Georgia,serif;font-size:38px;font-weight:400;line-height:1}.score-copy{display:grid;gap:9px;margin-top:12px}.score-copy p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.score-completed{white-space:nowrap}.score-completed span{color:var(--muted)}.score-completed b{color:var(--accent);font-weight:400}.bar{height:5px;background:#ece4e1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}.score-phrase{font-family:Georgia,serif;font-size:13px;color:#4f4749;line-height:1.4}
.habit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.habit-tile{min-height:76px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:center}.habit-check{width:34px;height:34px;border-radius:50%;background:#fff;border:1.7px solid #b9b0b1;position:relative;padding:0}.habit-check.done{background:var(--accent);border-color:var(--accent)}.habit-check.done:after{content:"✓";color:#fff;position:absolute;inset:0;display:grid;place-items:center;font-size:15px}.habit-check.partial{border-color:var(--accent);background:conic-gradient(var(--accent) var(--pct),#fff 0)}.habit-check.partial:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}.habit-area{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:3px}.habit-name{font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.habit-meta{font-size:11px;color:var(--muted);margin-top:5px}
.task-list{display:grid}.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task-check{width:19px;height:19px;border-radius:5px;background:#fff;border:1.5px solid #aaa;padding:0}.task-check.done{background:var(--accent);border-color:var(--accent);position:relative}.task-check.done:after{content:"✓";position:absolute;color:#fff;font-size:12px;inset:0;display:grid;place-items:center}.task-title{font-size:14px;line-height:1.35}.task-title.done{color:#332d2f}.task-sub{font-size:10px;color:var(--muted);margin-top:3px}.task-right{display:flex;align-items:center;gap:7px}.tag{padding:3px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:9px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}.priority{width:7px;height:7px;border-radius:50%;display:inline-block}.high{background:#8d2439}.medium{background:#c17b8d}.low{background:#d5b8be}.tasks-section{padding:16px 17px 14px;background:var(--card);box-shadow:none}.tasks-section .section-head{margin-bottom:8px;padding-bottom:12px}.tasks-count{font-size:10px;color:var(--muted);margin-top:4px}.tasks-section .task-list{padding-left:1px}.tasks-section .task{padding:13px 4px}.tasks-section .task:hover{background:#fcf7f5;border-radius:10px}.tasks-section .task:first-child{padding-top:12px}.tasks-section .task-title{color:#332d2f}.tasks-section .task-sub{color:#8a7d80}.tasks-section .task-check{border-color:#a89397}.tasks-section .task-actions .mini{background:var(--card)}.task-actions{display:flex;gap:5px}.mini{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#6c6264;padding:0}.mini:hover{border-color:#cbb5ba;color:var(--accent)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:400}.btn:hover{filter:brightness(.96)}.btn.ghost{background:transparent;border:1px solid #d7c5c9;color:var(--accent)}.btn.danger{background:#f2dfe3;color:var(--danger)}.tabs{display:flex;gap:3px;background:#eee7e4;padding:3px;border-radius:11px;width:max-content}.tabs button{border:0;background:transparent;color:#71686a;border-radius:8px;padding:7px 11px;font-size:11px;font-weight:400}.tabs button.active{background:#fff;color:var(--accent)}
/* planner */
.planner-tasks-card .planner-task-list{margin-top:4px}.planner-tasks-card .task{background:var(--task-list-color);color:var(--task-text-color);border-bottom:1px solid color-mix(in srgb,var(--task-text-color) 18%,transparent);border-radius:10px;margin:0 0 6px;padding:12px 10px}.planner-tasks-card .task:last-child{margin-bottom:0}.planner-tasks-card .task-title,.planner-tasks-card .task-title>div:first-child,.planner-tasks-card .task-sub{color:var(--task-text-color)!important}.planner-tasks-card .task-check{background:rgba(255,255,255,.82);border-color:rgba(0,0,0,.18)}.planner-tasks-card .task-check.done{background:var(--task-text-color);border-color:var(--task-text-color)}.planner-tasks-card .mini{background:rgba(255,255,255,.75);border-color:rgba(0,0,0,.10);color:#332d2f}.planner-tasks-card .task-list-tag{background:rgba(255,255,255,.22)!important;border-color:rgba(255,255,255,.28)!important;color:var(--task-text-color)!important}

.planner-date-picker{display:flex;align-items:center;gap:8px;margin:0 0 14px}.planner-weekbar{flex:1;margin:0}.planner-week-arrow{flex:0 0 32px}.planner-today-btn{flex:0 0 auto;white-space:nowrap}

.planner-day{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;margin-top:12px}.planner-day:first-child{margin-top:0}.planner-day-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 16px;background:#faf6f4;border-bottom:1px solid var(--line)}.planner-day-date{display:flex;align-items:baseline;gap:9px}.planner-day-weekday{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:500}.planner-day-date-main{font-family:Georgia,serif;font-size:17px;font-weight:400;color:var(--ink)}.planner-day-count{font-size:10px;color:var(--muted);white-space:nowrap}.planner-day .task-list{padding:0 16px}.planner-day .task{padding:12px 2px}.planner-day .task:last-child{border-bottom:0}.planner-day .task-sub{font-variant-numeric:tabular-nums}.planner-empty{padding:22px 16px;color:var(--muted);font-size:12px}.habit-group{margin-top:15px}.habit-group:first-child{margin-top:0}.group-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.group-title h3{font-family:Georgia,serif;font-weight:400;font-size:16px;margin:0}.habit-row{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.habit-row:last-child{border-bottom:0}.habit-main strong{font-weight:400;font-size:13px}.week-days{display:grid;grid-template-columns:repeat(7,30px);gap:5px}.day-dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#766b6d;font-size:10px;padding:0}.day-dot.done{background:var(--accent);border-color:var(--accent);color:#fff}.habit-stats{display:flex;gap:12px;color:var(--muted);font-size:11px;white-space:nowrap}

.habit-weekbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:14px}.habit-day{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 5px;text-align:center;color:var(--muted)}.habit-day span{display:block;font-size:10px}.habit-day b{display:block;font-family:Georgia,serif;font-size:15px;font-weight:400;margin-top:3px}.habit-day.active{background:var(--accent-soft);border-color:#dfc3c9;color:var(--accent)}.habit-day.today b{color:var(--accent)}.habit-group-card{border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:10px;overflow:hidden}.habit-group-card .group-title{padding:12px 14px;background:#faf5f3;border-bottom:1px solid var(--line);margin:0}.habit-group-card .group-title h3{font-size:16px}.habit-list{padding:0 14px}.habit-row{grid-template-columns:38px minmax(0,1fr) auto;gap:14px;padding:12px 0}.habit-row .week-days{display:none}.habit-row>.habit-check{align-self:center}.habit-action{display:flex;align-items:center;gap:12px}.habit-stat-stack{text-align:right;min-width:105px}.habit-stat-stack .big{font-size:12px}.habit-stat-stack .small{font-size:10px;color:var(--muted);margin-top:2px}.habit-progress-note{font-size:10px;color:var(--muted);margin-top:4px}.habit-main .habit-meta{margin-top:4px}
/* calendar */
.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:14px}.cal-nav{display:flex;align-items:center;gap:7px}.cal-title{font-family:Georgia,serif;font-size:20px;margin:0 8px;font-weight:400}.calendar{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;width:100%}.cal-head{display:grid;grid-template-columns:58px repeat(var(--days),minmax(0,1fr));border-bottom:1px solid var(--line)}.cal-head>div{padding:9px 8px;border-right:1px solid var(--line);font-size:11px;color:var(--muted)}.cal-head .dayhead{color:var(--ink)}.cal-head .today{color:var(--accent)}.all-day-row{display:grid;grid-template-columns:58px repeat(var(--days),minmax(0,1fr));border-bottom:1px solid var(--line);min-height:42px}.all-day-row>div{border-right:1px solid var(--line)}.all-day-label{font-size:9px;color:var(--muted);padding:13px 6px}.all-day-cell{padding:4px}.all-day-event{background:var(--accent-soft);color:var(--accent);border:1px solid #e3cbd1;border-radius:7px;padding:6px 7px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal-body{display:grid;grid-template-columns:58px 1fr;position:relative;overflow:hidden}.time-col{border-right:1px solid var(--line)}.hour{height:60px;border-bottom:1px solid #eee8e5;font-size:9px;color:#9b9193;padding:4px 6px}.days-area{display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr));position:relative;min-width:0;width:100%}.day-column{position:relative;border-right:1px solid #eee8e5;background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#f0eae8 30px,#f0eae8 30px,transparent 31px,transparent 59px,#eee8e5 60px)}.event{position:absolute;left:4px;right:4px;border-radius:8px;padding:6px 7px;color:#fff;font-size:10px;overflow:hidden;cursor:grab;user-select:none;touch-action:none;min-height:22px}.event .resize-handle{position:absolute;bottom:0;left:0;right:0;height:8px;cursor:ns-resize}.event.done{opacity:.55}.quick-add-preview{position:absolute;left:4px;right:4px;border:1px solid var(--accent);background:rgba(141,36,57,.12);border-radius:8px;pointer-events:none;z-index:5;opacity:0;transform:scaleY(.96);transform-origin:top;transition:opacity .12s ease,transform .12s ease;box-shadow:0 4px 14px rgba(141,36,57,.08)}.quick-add-preview.show{opacity:1;transform:scaleY(1)}.quick-add-preview span{position:absolute;top:6px;left:8px;font-size:10px;color:var(--accent);font-weight:650;white-space:nowrap}.empty-calendar{padding:20px;color:var(--muted);font-size:13px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.month-head{display:grid;grid-template-columns:repeat(7,1fr);background:#faf7f5}.month-head div{padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.month-cell{min-height:108px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.month-cell.muted{background:#fcfaf9;color:#aaa}.month-cell.today{background:#fff7f8}.month-date{font-size:11px;margin-bottom:6px}.month-date.current{color:var(--accent)}.month-event{display:block;width:100%;border:0;border-radius:6px;margin:3px 0;padding:4px 5px;text-align:left;color:#fff;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* weeks */
.week-picker{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;margin-bottom:12px}.week-picker-progress{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--muted);font-size:10px}.week-picker-progress b{font-family:Georgia,serif;font-size:16px;font-weight:400;color:var(--ink)}

.week-select{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.week-choice{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 9px;min-width:0;text-align:left}.week-choice.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.week-choice b{display:block;font-size:10px;font-weight:400}.week-choice span{display:block;font-size:9px;color:var(--muted);margin-top:3px}.week-detail{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.goal{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}.goal:last-child{margin-bottom:0}.goal-head{display:flex;justify-content:space-between;gap:10px}.goal-title{font-size:13px}.goal-target{font-size:11px;color:var(--muted);margin-top:3px}.progress-line{height:5px;background:#ece5e2;border-radius:99px;overflow:hidden;margin:10px 0 6px}.progress-line i{display:block;height:100%;background:var(--accent)}.goal-meta{font-size:10px;color:var(--muted)}.subgoals{margin:10px 0 0;padding-left:18px;color:#61585a;font-size:12px;line-height:1.55}.actions-list{margin-top:9px;display:grid;gap:5px}.action-item{font-size:11px;color:#6c6264;padding-left:12px;position:relative}.action-item:before{content:"";width:4px;height:4px;background:var(--accent);border-radius:50%;position:absolute;left:0;top:6px}
/* maddy */
.maddy-grid{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}.portrait{height:130px;border-radius:24px;background:#f0dfe2;border:1px solid #e1cdd2;display:grid;place-items:center;font-family:Georgia,serif;color:var(--accent);font-size:44px}.maddy-number{font-family:Georgia,serif;font-size:38px;font-weight:400}.maddy-areas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.area-card{border:1px solid var(--line);border-radius:13px;padding:13px}.area-card h3{font-family:Georgia,serif;font-size:15px;font-weight:400;margin:0 0 7px}.area-card p{font-size:11px;color:var(--muted);margin:0 0 8px}.moodboard{columns:3 180px;column-gap:10px}.mood-card{break-inside:avoid;margin:0 0 10px;border-radius:13px;overflow:hidden;background:#f0e8e5;border:1px solid var(--line);min-height:110px;position:relative}.mood-card img{display:block;width:100%;height:auto}.mood-placeholder{padding:25px 15px;color:var(--muted);font-size:12px;text-align:center}
/* my cabinet */
.cabinet-tabs{display:flex;gap:3px;background:#eee7e4;padding:3px;border-radius:11px;width:max-content;margin-bottom:14px}
.cabinet-tabs button{border:0;background:transparent;color:#71686a;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:400}
.cabinet-tabs button.active{background:#fff;color:var(--accent)}
.cabinet-notes-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;min-height:560px}
.cabinet-notes-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cabinet-notes-head{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}

.cabinet-note-item-date{font-size:9px;color:var(--muted)}

.cabinet-note-editor-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.cabinet-note-title-input{border:0;background:transparent;outline:0;font-family:Georgia,serif;font-size:22px;color:var(--ink);min-width:0;flex:1}
.cabinet-note-title-input::placeholder{color:#aaa0a1}
.cabinet-note-toolbar{display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:#faf7f5}
.cabinet-note-tool{width:30px;height:28px;border:1px solid transparent;background:transparent;border-radius:7px;color:#665b5d;padding:0;font-size:12px}
.cabinet-note-tool:hover{background:#fff;border-color:var(--line);color:var(--accent)}
.cabinet-note-tool strong{font-weight:700}.cabinet-note-tool em{font-style:italic}.cabinet-note-tool u{text-decoration:underline}
.cabinet-note-toolbar{gap:5px}.cabinet-note-tool-group{display:flex;align-items:center;gap:2px}.cabinet-note-divider{width:1px;height:20px;background:var(--line);margin:0 8px}.cabinet-note-format-group{padding-right:1px}.cabinet-note-icon-tool{display:grid;place-items:center;width:30px;height:28px}.cabinet-note-icon-tool svg{width:24px;height:24px;display:block;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}.cabinet-note-list-icon svg{stroke-width:1.45}.cabinet-note-list-icon svg text{stroke:none}.cabinet-note-tool.is-active{color:var(--accent);background:var(--accent-soft)}.cabinet-note-tool.is-active:hover{color:var(--accent);background:var(--accent-soft)}.cabinet-note-list-group{gap:1px}.cabinet-note-content ul.note-checklist{list-style:none;padding-left:0}.cabinet-note-content ul.note-checklist>li{display:flex;align-items:flex-start;gap:8px}.cabinet-note-content ul.note-checklist>li .note-check{flex:0 0 auto;margin-top:3px;width:15px;height:15px;accent-color:var(--accent)}.cabinet-note-content ul.note-checklist>li:has(> .note-check:checked){text-decoration:line-through;opacity:.6}.cabinet-note-content ul.note-checklist>li:has(> .note-check:checked) .note-check{opacity:1}
.cabinet-note-format-select{height:28px;border:1px solid transparent;background:transparent;border-radius:7px;color:#665b5d;padding:0 7px;font-size:11px;outline:0;cursor:pointer}
.cabinet-note-format-select:hover,.cabinet-note-format-select:focus{background:#fff;border-color:var(--line);color:var(--accent)}
.cabinet-note-content h1{font-family:Georgia,serif;font-weight:400;font-size:30px;line-height:1.15;margin:14px 0 8px}

 const d=raw||defaultData(); const def=defaultData();
 d.settings=d.settings||{}; d.settings.accentColor=d.settings.accentColor||def.settings.accentColor; d.settings.theme=d.settings.theme||def.settings.theme; d.settings.palette=Array.isArray(d.settings.palette)&&d.settings.palette.length?d.settings.palette:[...BASE_COLORS];

 d.habits=(Array.isArray(d.habits)?d.habits:[]).map(h=>({...h,area:migrateArea(h.area)||AREAS[0],days:h.days||{},target:Number(h.target)||1,unit:h.unit||'раз',color:h.color||d.settings.habitColor}));

const SUPABASE_ANON_KEY='sb_publishable_wS99l-N7SEcVMd28w_LC-Q__e2ZIlK4';
const CLOUD_STATE_ID='wp_ec564225d7eaea0f6eaabd3b3a8cec726884c1d7';
const CLOUD_STATE_URL=SUPABASE_URL+'/rest/v1/planner_state';
const CLOUD_BUCKET='planner-media';
let cloudReady=false, cloudSaving=Promise.resolve(), cloudLoading=false;

function persist(){

function cloudHeaders(extra={}){return Object.assign({'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},extra)}
function cloudSaveState(){
  const snapshot=JSON.parse(JSON.stringify(state));

      const r=await fetch(CLOUD_STATE_URL+'?on_conflict=id',{method:'POST',headers:cloudHeaders({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:CLOUD_STATE_ID,data:snapshot,updated_at:new Date().toISOString()})});

}
async function cloudLoadState(){
  try{
    const r=await fetch(CLOUD_STATE_URL+'?id=eq.'+encodeURIComponent(CLOUD_STATE_ID)+'&select=data,updated_at',{headers:cloudHeaders()});
    if(!r.ok) throw new Error('Cloud load '+r.status);
    const rows=await r.json();

  }catch(e){console.warn('Cloud sync load failed',e);return null}
}
async function cloudSignedUrl(path,expires=3600){
  if(!path)return '';
  try{
    const r=await fetch(SUPABASE_URL+'/storage/v1/object/sign/'+encodeURIComponent(CLOUD_BUCKET)+'/'+path,{method:'POST',headers:cloudHeaders({'Content-Type':'application/json'}),body:JSON.stringify({expiresIn:expires})});
    if(!r.ok) throw new Error('Sign '+r.status);
    const j=await r.json();
    return j.signedURL ? (SUPABASE_URL+'/storage/v1'+j.signedURL) : (j.signedUrl||'');
  }catch(e){console.warn('Cloud signed URL failed',e);return ''}
}

}

  const r=await fetch(SUPABASE_URL+'/storage/v1/object/'+encodeURIComponent(CLOUD_BUCKET)+'/'+path,{method:'POST',headers:cloudHeaders({'Content-Type':blob.type||'application/octet-stream','x-upsert':'true'}),body:blob});
  if(!r.ok) throw new Error('Cloud upload '+r.status);

async function cloudMigrateLocalMedia(){
  let changed=false;
  for(const x of motivationData()){

        x.storagePath=path;
        changed=true;

function todayTasks(){return state.tasks.filter(t=>taskIsActive(t)&&(t.date===todayISO()||t.repeat==='daily'))}

function cycleWeeks(){const now=new Date();const y=now.getFullYear();let s=monday(now);const out=[];let n=1;while(s.getFullYear()===y && addDays(s,6).getFullYear()===y){out.push({n,start:new Date(s),end:addDays(s,6)});s=addDays(s,7);n++}return out}
function currentCycle(){const weeks=cycleWeeks();const now=new Date();return weeks.find(w=>now>=w.start&&now<=w.end)||weeks[0]}
function areaProgress(area){const c=currentCycle(),start=isoDate(c.start),end=isoDate(c.end);const ts=state.tasks.filter(t=>t.area===area&&t.date>=start&&t.date<=end);const td=ts.length?ts.filter(t=>t.done).length/ts.length:0;const hs=state.habits.filter(h=>h.area===area);let hDone=0,hMax=0;hs.forEach(h=>{for(let i=0;i<7;i++){hMax++;if(habitDone(h,isoDate(addDays(c.start,i))))hDone++}});const hd=hMax?hDone/hMax:0;const gs=state.goals.length?state.goals.reduce((a,g)=>a+(Number(g.progress)||0),0)/state.goals.length/100:0;return Math.round((td+hd+gs)/3*100)}

function bindPlannerDateSwipe(){document.querySelectorAll('.planner-weekbar[data-swipe-kind]').forEach(el=>{if(el.dataset.swipeBound)return;el.dataset.swipeBound='1';let sx=0,sy=0,moving=false;el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;moving=true;el.style.transition='none'},{passive:true});el.addEventListener('touchmove',e=>{if(!moving)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>3){e.preventDefault();const x=Math.max(-el.parentElement.clientWidth,Math.min(el.parentElement.clientWidth,dx));el.style.transform='translate3d('+x+'px,0,0)';el.style.opacity=String(Math.max(.55,1-Math.abs(x)/260))}},{passive:false});el.addEventListener('touchend',e=>{if(!moving)return;moving=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)plannerSwipeDate(el.dataset.swipeKind,dx<0?1:-1,el);else{el.style.transition='transform .2s ease,opacity .2s ease';el.style.transform='translate3d(0,0,0)';el.style.opacity='1'}},{passive:true})})}

function bindPlannerTaskSwipes(){
  const root=document.querySelector('.planner-tasks-card');
  if(!root || root.dataset.swipesBound==='1')return;
  root.dataset.swipesBound='1';

  root.querySelectorAll('.task').forEach(task=>{
    if(task.closest('.planner-task-swipe-shell'))return;
    const match=(task.getAttribute('onclick')||'').match(/openTaskDetail\((\d+)\)/);
    if(!match)return;
    const id=match[1];

    const shell=document.createElement('div');
    shell.className='planner-task-swipe-shell';
    shell.dataset.taskId=id;

    const del=document.createElement('div');
    del.className='planner-task-swipe-action delete';
    del.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M8 10v7M12 10v7M16 10v7M6 7l1 13h10l1-13"></path></svg><span>Delete</span>';

    const complete=document.createElement('div');
    complete.className='planner-task-swipe-action complete';
    complete.innerHTML='<span>Complete</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.6 2.7L16.5 9"></path></svg>';

    task.parentNode.insertBefore(shell,task);
    shell.append(del,complete,task);

    let sx=0,sy=0,dx=0,dragging=false,moved=false,locked=false;

    function settle(){
      const shouldAnimate=moved&&Math.abs(dx)>10;
      dragging=false;
      shell.classList.remove('tap-static','is-swiping','swipe-delete','swipe-complete');
      task.style.transform='translate3d(0,0,0)';
      shell.style.setProperty('--swipe-progress','0');
      if(!shouldAnimate){
        shell.classList.remove('is-settling');
        task.style.transition='none';
        return;
      }
      shell.classList.add('is-settling');
      setTimeout(()=>shell.classList.remove('is-settling'),390);
    }

    shell.addEventListener('touchstart',e=>{
      if(locked || e.touches.length!==1)return;
      const t=e.touches[0];
      sx=t.clientX;sy=t.clientY;dx=0;dragging=true;moved=false;
      task.style.transition='none';
      shell.classList.add('tap-static');
      shell.classList.remove('is-swiping','is-settling','swipe-delete','swipe-complete');
    },{passive:true});

    shell.addEventListener('touchmove',e=>{
      if(!dragging || locked || e.touches.length!==1)return;
      const t=e.touches[0],dy=t.clientY-sy;
      dx=t.clientX-sx;
      if(Math.abs(dy)>Math.abs(dx)*1.15 && Math.abs(dy)>8){settle();return}
      /* A tap must NEVER move the task. Do not touch transform until a real horizontal swipe exists. */
      if(Math.abs(dx)<=10)return;
      if(Math.abs(dy)>Math.abs(dx)*1.15)return;
      if(e.cancelable)e.preventDefault();
      moved=true;
      shell.classList.remove('tap-static');
      shell.classList.add('is-swiping');
      const max=window.innerWidth*.72;
      const x=Math.max(-max,Math.min(max,dx));
      task.style.transform='translate3d('+x+'px,0,0)';
      shell.classList.toggle('swipe-delete',x>0);
      shell.classList.toggle('swipe-complete',x<0);
      shell.style.setProperty('--swipe-progress',String(Math.min(1,Math.abs(x)/105)));
    },{passive:false});

    shell.addEventListener('touchend',()=>{
      shell.classList.remove('tap-static');
      if(!dragging)return;
      const direction=dx>0?'delete':'complete';
      const threshold=Math.min(110,Math.max(78,window.innerWidth*.22));
      dragging=false;

      if(Math.abs(dx)>=threshold){
        locked=true;
        shell.classList.remove('is-swiping','swipe-delete','swipe-complete');
        shell.classList.add(direction==='delete'?'is-removing':'is-completing');
        shell.style.setProperty('--swipe-progress','1');
        setTimeout(()=>{
          const current=state.tasks.find(x=>x.id==id);
          if(!current)return;
          if(direction==='delete'){
            state.tasks=state.tasks.filter(x=>x.id!=id);
            persist();refresh();toast('Задача удалена');
          }else{
            if(!current.done){current.done=true;syncRPGFromPlanner();persist();}
            refresh();toast('Задача выполнена');
          }
        },340);
      }else{
        settle();
      }
    },{passive:true});

    shell.addEventListener('touchcancel',()=>{
      if(dragging)settle();
    },{passive:true});

    shell.addEventListener('click',e=>{
      if(moved){
        e.preventDefault();
        e.stopPropagation();
        moved=false;
      }
    },true);
  });
}

function ensureRPG(){
  state.rpg=state.rpg||{};
  state.rpg.traits=Array.isArray(state.rpg.traits)?state.rpg.traits:[];
  const defs=[
    ['Disciplined',30000],['Rich Girl',50000],['Sexy Body',10000],['Charismatic',2000],

  ];

    let t=state.rpg.traits.find(x=>x.name===name);
    if(!t){t={name,maxXP,xp:0,shownUp:0};state.rpg.traits.push(t)}

    t.xp=Number(t.xp)||0;t.shownUp=Number(t.shownUp)||0;
  });
  state.rpg.transactions=Array.isArray(state.rpg.transactions)?state.rpg.transactions:[];

    {id:'maddy',name:'Maddy Perez',description:'Confidence, sexuality, presence, boldness and courage.',traits:['Fearless','Charismatic','Seductive','Self-Obsessed']},
    {id:'spencer',name:'Spencer Hastings',description:'Discipline, logic, ambition, determination and composure.',traits:['Disciplined','Emotionally Stable']},
    {id:'blair',name:'Blair Waldorf',description:'Standards, ambition, control, strategy and determination.',traits:['Disciplined','Rich Girl','Self-Obsessed']},
    {id:'nancy',name:'Nancy Wheeler',description:'Cold logic, courage and doing what needs to be done despite fear.',traits:['Fearless','Emotionally Stable','Disciplined']}
  ];
  state.rpg.characters.forEach((c,i)=>{if(!c.id)c.id='char_'+i+'_'+Date.now();c.name=c.name||'Character';c.description=c.description||'';c.traits=Array.isArray(c.traits)?c.traits:[]});
  state.rpg.stats=state.rpg.stats||{startingWeight:'',currentWeight:'',goalWeight:'',currentIncome:'',incomeGoal:''};

function rpgAddTransaction(sourceKey,amount,source,item,traitName,date=todayISO()){

  if(r.transactions.some(x=>x.key===key&&x.trait===traitName))return false;

}

function rpgTaskCompletedOccurrences(t){
  const out=[];const repeat=t.repeat||'none';

  const end=parseDate(todayISO());const start=parseDate(t.date);const from=start>end?end:start;
  for(let d=new Date(from);d<=end;d=addDays(d,1)){
    const ds=isoDate(d);if(!taskMatchesCalendarOccurrence(t,ds))continue;const o=calendarTaskOccurrence(t,ds);if(o&&o.done)out.push({date:o.date,occurrence:ds})
  }

}

function rpgAutoTraitsFor(item){
  const area=item?.area||'';
  const rules=rpgAutoRules()[area]||[['Disciplined',6]];
  const text=String(item?.title||item?.name||'').toLowerCase();
  const extra=[];
  if(/клиент|продаж|деньг|заработ|доход|заказ|сайт|портфолио|отклик|коммерчес/.test(text)) extra.push(['Rich Girl',4],['Disciplined',3]);
  if(/трениров|зал|спорт|шаг|белок|калори|растяж|пилат|йог|фигур/.test(text)) extra.push(['Sexy Body',4]);
  if(/макияж|уход|волос|маник|наряд|одежд|космет|красив/.test(text)) extra.push(['Hot / Gorgeous',4],['Self-Obsessed',3]);
  if(/страх|боюсь|позвон|выступ|публикац|видео|сторис|пост|блог/.test(text)) extra.push(['Fearless',5]);
  if(/уборк|помыть|посуд|стир|дом|поряд|разобрать/.test(text)) extra.push(['Clean Girl',5]);
  if(/дневник|терап|медитац|отдых|сон|психолог/.test(text)) extra.push(['Emotionally Stable',5]);
  if(/свидан|отношен|парен|сообщен|встреч/.test(text)) extra.push(['Seductive',4],['Charismatic',3]);
  const merged=new Map();[...rules,...extra].forEach(([trait,xp])=>merged.set(trait,Math.max(merged.get(trait)||0,xp)));
  return [...merged.entries()];
}

function syncRPGFromPlanner(){
  const r=ensureRPG();
  state.tasks.forEach(t=>{
    if(!t.done)return;
    const base=rpgAutoXPForTask(t), rules=rpgAutoTraitsFor(t);
    rules.forEach(([trait,weight])=>rpgAddTransaction('auto:task:'+t.id,Math.max(1,Math.round(base*weight/10)),'Task',t.title,trait,t.date||todayISO()));
    // Legacy manual RPG settings remain supported but are no longer required.
    const xp=Number(t.rpgXP)||0;if(xp&&Array.isArray(t.rpgTraits))t.rpgTraits.forEach(tr=>rpgAddTransaction('legacy:task:'+t.id,xp,'Task',t.title,tr,t.date||todayISO()));
  });
  state.habits.forEach(h=>{
    Object.entries(h.days||{}).forEach(([date,v])=>{if(Number(v)<Number(h.target||1))return;const base=rpgAutoXPForHabit(h),rules=rpgAutoTraitsFor(h);rules.forEach(([trait,weight])=>rpgAddTransaction('auto:habit:'+h.id+':'+date,Math.max(1,Math.round(base*weight/10)),'Habit',h.name,trait,date));const xp=Number(h.rpgXP)||0;if(xp&&Array.isArray(h.rpgTraits))h.rpgTraits.forEach(tr=>rpgAddTransaction('legacy:habit:'+h.id+':'+date,xp,'Habit',h.name,tr,date))});
  });
  state.goals.forEach(g=>{
    if(Number(g.progress)<100)return;
    const pseudo={title:g.title,area:'Работа и заработок'};
    rpgAutoTraitsFor(pseudo).forEach(([trait,weight])=>rpgAddTransaction('auto:goal:'+g.id,Math.max(1,Math.round(15*weight/10)),'Goal',g.title,trait,todayISO()));
    const xp=Number(g.rewardXP)||0;if(xp&&Array.isArray(g.rpgTraits))g.rpgTraits.forEach(tr=>rpgAddTransaction('legacy:goal:'+g.id,xp,'Goal',g.title,tr,todayISO()));
  });
}
function conditionProgressForTrait(traitName){
  const r=ensureRPG(), xs=r.statements.filter(s=>s.trait===traitName);

  const vals=xs.map(statementProgress);

function traitXPProgress(t){return t.maxXP!==null&&Number(t.maxXP)>0?Math.min(1,Math.max(0,Number(t.xp||0)/Number(t.maxXP))):null}
function traitFinalProgress(t){
  const xp=traitXPProgress(t),cond=conditionProgressForTrait(t.name);
  if(xp===null)return cond;
  if(cond===null)return xp;
  return (xp+cond)/2;
}
function rpgOverall(){

function rpgLevel(t){

   const v=document.createElement('video');
   v.muted=true; v.defaultMuted=true; v.playsInline=true;

     const onOk=()=>{if(done)return;done=true;cleanup();resolve()};
     const onErr=()=>{if(done)return;done=true;cleanup();reject(v.error||new Error('video load failed'))};
     const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error(event+' timeout'))},timeout);

   const duration=Number.isFinite(v.duration)?v.duration:0;
   // Avoid the usual black intro frame.
   const target=duration>0?Math.min(Math.max(duration*0.08,0.2),3):0;
   if(target>0){
     await new Promise((resolve,reject)=>{
       let done=false;
       const cleanup=()=>{clearTimeout(timer);v.removeEventListener('seeked',onSeek);v.removeEventListener('error',onErr)};
       const onSeek=()=>{if(done)return;done=true;cleanup();resolve()};
       const onErr=()=>{if(done)return;done=true;cleanup();reject(v.error||new Error('seek failed'))};
       const timer=setTimeout(()=>{if(done)return;done=true;cleanup();resolve()},15000);
       v.addEventListener('seeked',onSeek,{once:true});

       await new Promise(r=>setTimeout(r,250));
     }
   }catch(e){

     await new Promise(r=>setTimeout(r,250));
   }

   const scale=Math.min(1,max/v.videoWidth);
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(v.videoWidth*scale));
   canvas.height=Math.max(1,Math.round(v.videoHeight*scale));

   console.warn('Video poster unavailable',e);

function renderSettings(){const pal=state.settings.palette;document.getElementById('page').innerHTML=`<header class="page-head"><div class="eyebrow">Персонализация</div><h1 class="title">Настройки</h1><div class="date">Настрой внешний вид приложения.</div></header><div class="grid2"><section class="card"><div class="section-head"><h2>Акцентный цвет приложения</h2></div><div class="swatches app-accent-swatches"><button class="swatch ${state.settings.accentColor==='#9b4057'?'selected':''}" style="background:#9b4057" onclick="setAppAccent('#9b4057')"></button><button class="swatch ${state.settings.accentColor==='#c77b91'?'selected':''}" style="background:#c77b91" onclick="setAppAccent('#c77b91')"></button><button class="swatch ${state.settings.accentColor==='#d49aab'?'selected':''}" style="background:#d49aab" onclick="setAppAccent('#d49aab')"></button><button class="swatch ${state.settings.accentColor==='#a87991'?'selected':''}" style="background:#a87991" onclick="setAppAccent('#a87991')"></button><button class="swatch ${state.settings.accentColor==='#8d6f80'?'selected':''}" style="background:#8d6f80" onclick="setAppAccent('#8d6f80')"></button><button class="swatch ${state.settings.accentColor==='#6f8f8a'?'selected':''}" style="background:#6f8f8a" onclick="setAppAccent('#6f8f8a')"></button><button class="swatch ${state.settings.accentColor==='#7e91a8'?'selected':''}" style="background:#7e91a8" onclick="setAppAccent('#7e91a8')"></button><button class="swatch ${state.settings.accentColor==='#b29478'?'selected':''}" style="background:#b29478" onclick="setAppAccent('#b29478')"></button><button class="swatch ${state.settings.accentColor==='#9a86a8'?'selected':''}" style="background:#9a86a8" onclick="setAppAccent('#9a86a8')"></button></div><div class="palette-row app-accent-custom"><input id="appAccentCustom" class="color-picker" type="color" value="${state.settings.accentColor||'#8d2439'}"><button class="btn ghost" onclick="setAppAccent(document.getElementById('appAccentCustom').value)">Выбрать</button></div></section><section class="card"><div class="section-head"><h2>Тема</h2></div><div class="theme-choices"><button class="theme-choice ${state.settings.theme==='classic'?'active':''}" onclick="setAppTheme('classic')"><span class="theme-preview theme-preview-classic"></span><span>Тёплая</span></button><button class="theme-choice ${state.settings.theme==='pastel'?'active':''}" onclick="setAppTheme('pastel')"><span class="theme-preview theme-preview-pastel"></span><span>Белая · пастельная</span></button></div><p class="setting-note">Белая тема использует белый фон и мягкую пастельную палитру.</p></section></div><div class="grid2"><section class="card"><div class="section-head"><h2>Стандартный цвет задач</h2></div><div class="swatches">${pal.map(c=>`<button class="swatch ${state.settings.taskColor===c?'selected':''}" style="background:${c}" onclick="setColor('taskColor','${c}')" title="${c}"></button>`).join('')}</div></section><section class="card"><div class="section-head"><h2>Стандартный цвет привычек</h2></div><div class="swatches">${pal.map(c=>`<button class="swatch ${state.settings.habitColor===c?'selected':''}" style="background:${c}" onclick="setColor('habitColor','${c}')" title="${c}"></button>`).join('')}</div></section><section class="card"><div class="section-head"><h2>Моя палитра</h2></div><div class="palette-row"><input id="newColor" class="color-picker" type="color" value="#8d2439"><button class="btn ghost" onclick="addPaletteColor()">Добавить оттенок</button></div><p class="setting-note">Добавленный оттенок сразу появится в палитре задач, привычек и попапе редактирования.</p></section><section class="card"><div class="section-head"><h2>Списки</h2><button class="btn ghost" onclick="openAreaModal()">+ Добавить</button></div><div class="settings-area-list">${AREAS.map((a,i)=>`<div class="settings-area-row"><span>${esc(a)}</span><div class="task-actions"><button class="mini" onclick="openAreaModal(${i})" title="Редактировать">✎</button><button class="mini" onclick="deleteArea(${i})" title="Удалить">×</button></div></div>`).join('')}</div><p class="setting-note">Эти сферы используются в задачах, привычках и автоматическом начислении XP.</p></section><section class="card"><div class="section-head"><h2>Время календаря</h2></div><div class="form-grid calendar-settings-grid"><div class="field"><label>Начало</label><input id="calendarStart" type="time" class="text-input" value="${state.settings.calendarStart||'08:00'}"></div><div class="field"><label>Конец</label><input id="calendarEnd" type="time" class="text-input" value="${state.settings.calendarEnd||'19:00'}"></div></div><p class="setting-note">В календаре будет отображаться только выбранный промежуток времени.</p><button class="btn" onclick="saveCalendarRange()">Сохранить время</button></section><section class="card"><div class="section-head"><h2>Данные</h2></div><button class="btn danger" onclick="resetApp()">Сбросить приложение</button></section></div>`} 
function openAreaModal(index=-1){const editing=index>=0?AREAS[index]:null;document.getElementById('modal').innerHTML=`<div class="modal-head"><div class="modal-title">${editing?'Редактировать список':'Новый список'}</div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Название</label><input id="areaName" class="text-input" value="${esc(editing||'')}" placeholder="Например, Работа и заработок"></div><div class="field"><label>Цвет списка</label><input id="areaColor" class="color-picker" type="color" value="${editing?taskListColor(editing):'#8d2439'}"></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button>${editing?`<button class="btn danger" onclick="deleteArea(${index});closeModal()">Удалить</button>`:''}<button class="btn" onclick="saveArea(${index})">Сохранить</button></div>`;openModal();setTimeout(()=>document.getElementById('areaName')?.focus(),50)}
function saveArea(index=-1){const name=document.getElementById('areaName').value.trim();const color=document.getElementById('areaColor')?.value||'#8d2439';if(!name){toast('Напиши название списка');return}if(AREAS.some((a,i)=>a.toLowerCase()===name.toLowerCase()&&i!==index)){toast('Такой список уже есть');return}state.settings.listColors=state.settings.listColors||{};if(index>=0){const old=AREAS[index];const oldColor=state.settings.listColors[old]||color;AREAS[index]=name;state.tasks.forEach(t=>{if(t.area===old)t.area=name});state.habits.forEach(h=>{if(h.area===old)h.area=name});delete state.settings.listColors[old];state.settings.listColors[name]=color||oldColor}else{AREAS.push(name);state.settings.listColors[name]=color}AREA_LABEL[name]=name;state.settings.areas=[...AREAS];persist();closeModal();renderSidebarLists();renderSettings();toast(index>=0?'Список изменён':'Список добавлен')}
function deleteArea(index){if(index<0||index>=AREAS.length)return;if(AREAS.length<=1){toast('Должна остаться хотя бы одна сфера');return}const old=AREAS[index],fallback=AREAS[index===0?1:0];if(!confirm(`Удалить сферу «${old}»? Задачи и привычки из неё будут перенесены в «${fallback}».`))return;state.tasks.forEach(t=>{if(t.area===old)t.area=fallback});state.habits.forEach(h=>{if(h.area===old)h.area=fallback});AREAS.splice(index,1);state.settings.areas=[...AREAS];persist();renderSettings();toast('Сфера удалена')}

function resetApp(){if(!confirm('Сбросить все данные приложения?'))return;state=defaultData();persist();go('today');toast('Данные сброшены')}
function toggleNoTimeFields(){const nt=document.getElementById('fNoTime'),ad=document.getElementById('fAllDay'),st=document.getElementById('fStart'),en=document.getElementById('fEnd');if(!nt||!ad||!st||!en)return;if(nt.checked){ad.checked=false;st.value='';en.value='';st.disabled=true;en.disabled=true}else if(ad.checked){nt.checked=false;st.value='';en.value='';st.disabled=true;en.disabled=true}else{st.disabled=false;en.disabled=false;if(!st.value)st.value='12:30';if(!en.value)en.value='13:30'}}
function openTaskModal(id=0,prefill={},fromCalendar=false,occurrenceDate=''){const t=id?state.tasks.find(x=>x.id==id):null;const occ=t&&fromCalendar?calendarTaskOccurrence(t,occurrenceDate||t.date):null;const x=occ||t||{title:'',area:'',priority:'',date:prefill.date||todayISO(),start:prefill.start||'12:30',end:prefill.end||'13:30',repeat:'none',repeatDays:[],allDay:false,noTime:false,color:state.settings.taskColor,notes:''};const pal=state.settings.palette;const repeat=x.repeat||'none';const days=x.repeatDays||[];const repeatField=fromCalendar?`<div class="field"><label>Повтор</label><select id="fRepeat" class="select" onchange="toggleCalendarRepeatDays()"><option value="none" ${repeat==='none'?'selected':''}>Не повторять</option><option value="daily" ${repeat==='daily'?'selected':''}>Каждый день</option><option value="weekly" ${repeat==='weekly'?'selected':''}>Каждую неделю</option><option value="monthly" ${repeat==='monthly'?'selected':''}>Каждый месяц</option><option value="weekdays" ${repeat==='weekdays'?'selected':''}>Конкретные дни недели</option></select></div>`:`<div class="field"><label>Повтор</label><select id="fRepeat" class="select"><option value="none" ${repeat==='none'?'selected':''}>Не повторять</option><option value="daily" ${repeat==='daily'?'selected':''}>Каждый день</option></select></div>`;const daysField=fromCalendar?`<div id="repeatDaysField" class="field full" style="display:${repeat==='weekdays'?'grid':'none'}"><label>Дни недели</label><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px">${DAYS.map((d,i)=>`<label style="display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px"><input type="checkbox" class="repeat-day" value="${i}" ${days.includes(i)?'checked':''}>${d}</label>`).join('')}</div></div>`:'';document.getElementById('modal').innerHTML=`<div class="modal-head"><div class="modal-title">${t?'Редактировать задачу':'Новая задача'}</div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>Название</label><input id="fTitle" class="text-input" value="${esc(x.title)}" placeholder="Что нужно сделать?"></div><div class="field"><label>Список</label><select id="fArea" class="select"><option value="">Не выбран</option>${AREAS.map(a=>`<option value="${a}" ${x.area===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Приоритет</label><select id="fPriority" class="select"><option value="">Не выбран</option><option value="high" ${x.priority==='high'?'selected':''}>Высокий</option><option value="medium" ${x.priority==='medium'?'selected':''}>Средний</option><option value="low" ${x.priority==='low'?'selected':''}>Низкий</option></select></div><div class="field"><label>Дата</label><input id="fDate" type="date" class="text-input" value="${x.date}"></div>${repeatField}${daysField}<div class="field full"><label>Время</label><div class="inline"><input id="fStart" type="time" class="text-input" value="${x.start||''}"><span>—</span><input id="fEnd" type="time" class="text-input" value="${x.end||''}"></div></div><div class="field full"><label class="inline"><input id="fNoTime" type="checkbox" ${x.noTime?'checked':''} onchange="toggleNoTimeFields()"> <span>Без времени</span></label></div><div class="field full"><label class="inline"><input id="fAllDay" type="checkbox" ${x.allDay?'checked':''} onchange="toggleNoTimeFields()"> <span>Весь день</span></label></div><div class="field full"><label>Цвет</label><div class="modal-color-grid">${pal.map(c=>`<button type="button" class="modal-color ${x.color===c?'selected':''}" style="background:${c}" onclick="selectModalColor('${c}')"></button>`).join('')}</div><input id="fColor" type="hidden" value="${x.color||state.settings.taskColor}"></div><div class="field full"><label>Описание</label><textarea id="fNotes" class="text-input" rows="3" placeholder="Если нужно, добавь контекст">${esc(x.notes||'')}</textarea></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button>${t?`<button class="btn danger" onclick="deleteTask(${t.id});closeModal()">Удалить</button>`:''}<button class="btn" onclick="saveTask(${id||0},${fromCalendar},'${occurrenceDate||''}')">${t?'Сохранить':'Добавить задачу'}</button></div>`;openModal();toggleNoTimeFields()}
function toggleCalendarRepeatDays(){const el=document.getElementById('repeatDaysField');if(el)el.style.display=document.getElementById('fRepeat').value==='weekdays'?'grid':'none'}
function selectModalColor(c){document.getElementById('fColor').value=c;document.querySelectorAll('.modal-color').forEach(b=>b.classList.toggle('selected',b.style.backgroundColor===hexToRgb(c)||b.style.backgroundColor===c))}
function hexToRgb(hex){const h=hex.replace('#','');const n=parseInt(h,16);return `rgb(${n>>16 & 255}, ${n>>8 & 255}, ${n & 255})`}
function hexToSoft(hex){const h=hex.replace('#','');const n=parseInt(h,16);const r=n>>16&255,g=n>>8&255,b=n&255;return `rgba(${r},${g},${b},.10)`}
function saveTask(id,fromCalendar=false,occurrenceDate=''){const title=document.getElementById('fTitle').value.trim();if(!title){toast('Напиши название задачи');return}let start=document.getElementById('fStart').value,end=document.getElementById('fEnd').value;let noTime=document.getElementById('fNoTime')?.checked||false;let allDay=document.getElementById('fAllDay').checked;if(noTime){allDay=false;start='';end=''}else if(allDay){start='';end=''}else{if(!start)start='12:30';if(!end)end=minToTime(timeToMin(start)+60);if(timeToMin(end)<=timeToMin(start))end=minToTime(timeToMin(start)+30)}let repeat=document.getElementById('fRepeat').value;const existing=id?state.tasks.find(x=>x.id==id):null;if(!fromCalendar&&existing&&['none','daily'].indexOf(existing.repeat||'none')===-1)repeat=existing.repeat;const obj={title,area:document.getElementById('fArea').value,priority:document.getElementById('fPriority').value,date:document.getElementById('fDate').value,repeat,repeatDays:fromCalendar?[...document.querySelectorAll('.repeat-day:checked')].map(x=>Number(x.value)):(existing?.repeatDays||[]),start,end,allDay,noTime,color:document.getElementById('fColor').value||state.settings.taskColor,notes:document.getElementById('fNotes').value.trim()};if(id){const t=state.tasks.find(x=>x.id==id);if(t){if(fromCalendar&&t.repeat!=='none'&&occurrenceDate){t.overrides=t.overrides||{};t.overrides[occurrenceDate]={...(t.overrides[occurrenceDate]||{}),date:obj.date,start:obj.start,end:obj.end,allDay:obj.allDay,noTime:obj.noTime};Object.assign(t,{title:obj.title,area:obj.area,priority:obj.priority,repeat:obj.repeat,repeatDays:obj.repeatDays,color:obj.color,notes:obj.notes})}else Object.assign(t,obj)}}else state.tasks.push({id:Date.now(),done:false,overrides:{},...obj});persist();closeModal();if(currentPage==='planner')renderPlanner();else renderCalendar();toast(id?'Задача изменена':'Задача добавлена')}
function openHabitModal(id){const h=id?state.habits.find(x=>x.id==id):null;const x=h||{name:'',area:'',target:1,unit:'раз',color:state.settings.habitColor};const pal=state.settings.palette;document.getElementById('modal').innerHTML=`<div class="modal-head"><div class="modal-title">${h?'Редактировать привычку':'Новая привычка'}</div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>Название</label><input id="hName" class="text-input" value="${esc(x.name)}" placeholder="Например, 5 000 шагов"></div><div class="field"><label>Area</label><select id="hArea" class="select"><option value="">Не выбрана</option>${AREAS.map(a=>`<option value="${a}" ${x.area===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Цель за день</label><input id="hTarget" type="number" min="1" class="text-input" value="${x.target}"></div><div class="field"><label>Единица</label><input id="hUnit" class="text-input" value="${esc(x.unit)}" placeholder="минут, шагов, раз"></div><div class="field full"><label>Цвет</label><div class="modal-color-grid">${pal.map(c=>`<button type="button" class="modal-color ${x.color===c?'selected':''}" style="background:${c}" onclick="selectHabitModalColor('${c}')"></button>`).join('')}</div><input id="hColor" type="hidden" value="${x.color||state.settings.habitColor}"></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button>${h?`<button class="btn danger" onclick="deleteHabit(${h.id});closeModal()">Удалить</button>`:''}<button class="btn" onclick="saveHabit(${id||0})">${h?'Сохранить':'Добавить привычку'}</button></div>`;openModal()}
function selectHabitModalColor(c){document.getElementById('hColor').value=c;document.querySelectorAll('.modal-color').forEach(b=>b.classList.toggle('selected',b.style.backgroundColor===hexToRgb(c)||b.style.backgroundColor===c))}
function saveHabit(id){const name=document.getElementById('hName').value.trim();if(!name){toast('Напиши название');return}const obj={name,area:document.getElementById('hArea').value||'Personal',target:Math.max(1,Number(document.getElementById('hTarget').value)||1),unit:document.getElementById('hUnit').value.trim()||'раз',color:document.getElementById('hColor').value||state.settings.habitColor};if(id){const h=state.habits.find(x=>x.id==id);if(h)Object.assign(h,obj)}else state.habits.push({id:Date.now(),days:{},...obj});refresh();closeModal();toast(id?'Привычка изменена':'Привычка добавлена')}
function openGoalModal(id){const g=id?state.goals.find(x=>x.id==id):null;const x=g||{title:'',target:'',progress:0,subgoals:[],actions:[]};document.getElementById('modal').innerHTML=`<div class="modal-head"><div class="modal-title">${g?'Редактировать цель':'Новая цель'}</div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>Цель</label><input id="gTitle" class="text-input" value="${esc(x.title)}" placeholder="Например, заработать 350 000 ₽ / месяц"></div><div class="field"><label>Результат</label><input id="gTarget" class="text-input" value="${esc(x.target)}"></div><div class="field"><label>Прогресс</label><input id="gProgress" type="number" min="0" max="100" class="text-input" value="${x.progress}"></div><div class="field full"><label>Подцели — по одной в строке</label><textarea id="gSubs" class="text-input" rows="4">${esc(x.subgoals.join('\n'))}</textarea></div><div class="field full"><label>Конкретные действия — по одному в строке</label><textarea id="gActs" class="text-input" rows="5">${esc(x.actions.join('\n'))}</textarea></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Отмена</button>${g?`<button class="btn danger" onclick="deleteGoal(${g.id});closeModal()">Удалить</button>`:''}<button class="btn" onclick="saveGoal(${id||0})">Сохранить</button></div>`;openModal()}
function saveGoal(id){const obj={title:document.getElementById('gTitle').value.trim(),target:document.getElementById('gTarget').value.trim(),progress:Math.max(0,Math.min(100,Number(document.getElementById('gProgress').value)||0)),subgoals:document.getElementById('gSubs').value.split('\n').map(x=>x.trim()).filter(Boolean),actions:document.getElementById('gActs').value.split('\n').map(x=>x.trim()).filter(Boolean)};if(!obj.title){toast('Напиши цель');return}if(id){const g=state.goals.find(x=>x.id==id);if(g)Object.assign(g,obj)}else{obj.id=Date.now();state.goals.push(obj)}syncRPGFromPlanner();refresh();closeModal()}
function openModal(){document.getElementById('modalWrap').classList.add('open')}function closeModal(){document.getElementById('modalWrap').classList.remove('open')}
document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
let currentPage='today';
function pageFromHash(){
 const p=String(location.hash||'').replace(/^#/,'').trim().toLowerCase();
 return ['today','planner','calendar','weeks','maddy','cabinet','settings'].includes(p)?p:'today';
}
function go(p, updateUrl=true){
 const previousPage=currentPage;
 if(updateUrl && location.hash!=='#'+p) history.pushState({page:p},'', '#'+p);
 const pageEl=document.getElementById('page');
 const previousHTML=pageEl?pageEl.innerHTML:'';
 currentPage=p;
 if(pageEl)pageEl.classList.toggle('today-page',p==='today');
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 document.querySelectorAll('.mobile-nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 const moreActive=['maddy','cabinet','settings'].includes(p);
 if(mobileMoreBtn)mobileMoreBtn.classList.toggle('active',moreActive);
 document.querySelectorAll('.mobile-more-menu button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 let result;
 try{
   if(p==='today')result=renderToday();
   else if(p==='planner')result=renderPlanner();
   else if(p==='calendar')result=renderCalendar();
   else if(p==='weeks')result=renderWeeks();
   else if(p==='maddy')result=renderMaddy();
   else if(p==='cabinet')result=renderCabinet();
   else if(p==='settings')result=renderSettings();
 }catch(e){
   console.error('Navigation render failed:',e);
   currentPage=previousPage;
   document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===previousPage));
   document.querySelectorAll('.mobile-nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===previousPage));
   if(mobileMoreBtn)mobileMoreBtn.classList.toggle('active',['maddy','cabinet','settings'].includes(previousPage));
   document.querySelectorAll('.mobile-more-menu button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===previousPage));
   if(pageEl)pageEl.innerHTML=previousHTML;
   toast('Раздел не удалось открыть — изменения страницы сохранены');
   return;
 }
 if(result&&typeof result.catch==='function'){
   result.catch(e=>{
     console.error('Navigation render failed:',e);
     currentPage=previousPage;
     document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===previousPage));
     document.querySelectorAll('.mobile-nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===previousPage));
     if(mobileMoreBtn)mobileMoreBtn.classList.toggle('active',['maddy','cabinet','settings'].includes(previousPage));
     document.querySelectorAll('.mobile-more-menu button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===previousPage));
     if(pageEl)pageEl.innerHTML=previousHTML;
     toast('Раздел не удалось открыть — изменения страницы сохранены');
   });
 }
}
document.addEventListener('click',e=>{
 const navButton=e.target.closest('.nav button[data-page], .rail-btn[data-page], .mobile-nav button[data-page], .mobile-more-menu button[data-page]');
 if(!navButton)return;
 e.preventDefault();
 go(navButton.dataset.page);
 if(navButton.closest('.mobile-nav')||navButton.closest('.mobile-more-menu'))closeMobileMore();
 if(navButton.closest('.rail-btn')){document.querySelectorAll('.rail-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===navButton.dataset.page));}
});
const mobileMoreBtn=document.querySelector('.mobile-more-btn');

function taskListColor(area){
  const colors=state?.settings?.listColors||{};
  if(colors[area])return colors[area];
  const i=AREAS.indexOf(area);
  return BASE_COLORS[(i>=0?i:0)%BASE_COLORS.length];
}
function contrastTextColor(hex){
  const h=String(hex||'').replace('#','');
  if(h.length!==6)return '#fff';
  const n=parseInt(h,16),r=n>>16&255,g=n>>8&255,b=n&255;
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.62?'#332d2f':'#fff';
}
function taskSubtasks(t){
  if(!Array.isArray(t.subtasks)) t.subtasks=[];
  return t.subtasks;
}

  const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');

<script id="today-task-swipe-script">
function bindTodayTaskSwipes(){
  const root=document.querySelector('.today-page .tasks-section');
  if(!root || root.dataset.swipesBound==='1')return;
  root.dataset.swipesBound='1';

  root.querySelectorAll('.task').forEach(task=>{
    if(task.closest('.today-task-swipe-shell'))return;
    const match=(task.getAttribute('onclick')||'').match(/openTaskDetail\((\d+)\)/);
    if(!match)return;
    const id=match[1];

    const shell=document.createElement('div');
    shell.className='today-task-swipe-shell';
    shell.dataset.taskId=id;

    const del=document.createElement('div');
    del.className='today-task-swipe-action delete';
    del.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M8 10v7M12 10v7M16 10v7M6 7l1 13h10l1-13"></path></svg><span>Delete</span>';

    const complete=document.createElement('div');
    complete.className='today-task-swipe-action complete';
    complete.innerHTML='<span>Complete</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.6 2.7L16.5 9"></path></svg>';

    task.parentNode.insertBefore(shell,task);
    shell.append(del,complete,task);

    let sx=0,sy=0,dx=0,dragging=false,moved=false,locked=false;

    function settle(){
      const shouldAnimate=moved&&Math.abs(dx)>10;
      dragging=false;
      shell.classList.remove('tap-static','is-swiping','swipe-delete','swipe-complete');
      task.style.transform='translate3d(0,0,0)';
      shell.style.setProperty('--swipe-progress','0');
      if(!shouldAnimate){
        shell.classList.remove('is-settling');
        task.style.transition='none';
        return;
      }
      shell.classList.add('is-settling');
      setTimeout(()=>shell.classList.remove('is-settling'),390);
    }

    shell.addEventListener('touchstart',e=>{
      if(locked || e.touches.length!==1)return;
      const t=e.touches[0];
      sx=t.clientX;sy=t.clientY;dx=0;dragging=true;moved=false;
      task.style.transition='none';
      shell.classList.add('tap-static');
      shell.classList.remove('is-swiping','is-settling','swipe-delete','swipe-complete');
    },{passive:true});

    shell.addEventListener('touchmove',e=>{
      if(!dragging || locked || e.touches.length!==1)return;
      const t=e.touches[0],dy=t.clientY-sy;
      dx=t.clientX-sx;
      if(Math.abs(dy)>Math.abs(dx)*1.15 && Math.abs(dy)>8){settle();return}
      /* A tap must NEVER move the task. Do not touch transform until a real horizontal swipe exists. */
      if(Math.abs(dx)<=10)return;
      if(Math.abs(dy)>Math.abs(dx)*1.15)return;
      if(e.cancelable)e.preventDefault();
      moved=true;
      shell.classList.remove('tap-static');
      shell.classList.add('is-swiping');
      const max=window.innerWidth*.72;
      const x=Math.max(-max,Math.min(max,dx));
      task.style.transform='translate3d('+x+'px,0,0)';
      shell.classList.toggle('swipe-delete',x>0);
      shell.classList.toggle('swipe-complete',x<0);
      shell.style.setProperty('--swipe-progress',String(Math.min(1,Math.abs(x)/105)));
    },{passive:false});

    shell.addEventListener('touchend',()=>{
      shell.classList.remove('tap-static');
      if(!dragging)return;
      const direction=dx>0?'delete':'complete';
      const threshold=Math.min(110,Math.max(78,window.innerWidth*.22));
      dragging=false;

      if(Math.abs(dx)>=threshold){
        locked=true;
        shell.classList.remove('is-swiping','swipe-delete','swipe-complete');
        shell.classList.add(direction==='delete'?'is-removing':'is-completing');
        shell.style.setProperty('--swipe-progress','1');
        setTimeout(()=>{
          const current=state.tasks.find(x=>x.id==id);
          if(!current)return;
          if(direction==='delete'){
            state.tasks=state.tasks.filter(x=>x.id!=id);
            persist();refresh();toast('Задача удалена');
          }else{
            if(!current.done){current.done=true;syncRPGFromPlanner();persist();}
            refresh();toast('Задача выполнена');
          }
        },340);
      }else{
        settle();
      }
    },{passive:true});

    shell.addEventListener('touchcancel',()=>{
      if(dragging)settle();
    },{passive:true});

    shell.addEventListener('click',e=>{
      if(moved){
        e.preventDefault();
        e.stopPropagation();
        moved=false;
      }
    },true);
  });
}

const __todayRenderForSwipe=renderToday;
renderToday=function(){
  const result=__todayRenderForSwipe();
  bindTodayTaskSwipes();
  return result;
};
</script>

<script>
(function bindMobileScrollHeaderStrip(){
  const app=document.querySelector('.app');
  if(!app)return;

  const strip=document.createElement('div');
  strip.className='mobile-scroll-header-strip';
  strip.setAttribute('aria-hidden','true');
  app.appendChild(strip);

  const update=()=>{
    if(window.innerWidth>700){
      app.classList.remove('mobile-scroll-header-visible');
      return;
    }
    app.classList.toggle('mobile-scroll-header-visible',window.scrollY>8 && !app.classList.contains('mobile-sidebar-open'));
  };

  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(ticking)return;
    ticking=true;
    requestAnimationFrame(()=>{update();ticking=false});
  },{passive:true});
  window.addEventListener('resize',update,{passive:true});
  update();
})();
</script>

    if(target && target.closest && target.closest('.today-task-swipe-shell,.planner-task-swipe-shell'))return;
    sx=x;
    sy=y;
    tracking=true;
  }

  function move(x,y,e){
    if(!tracking)return;

    const dx=x-sx;
    const dy=y-sy;

    // Any clear rightward horizontal swipe, regardless of where it starts.
    if(dx>18 && dx>Math.abs(dy)*1.05){
      tracking=false;
      if(e && e.cancelable)e.preventDefault();

      if(typeof toggleMobileSidebar==='function'){
        toggleMobileSidebar();
      }else{
        app.classList.add('mobile-sidebar-open');
      }
      return;
    }

    // Cancel only a clearly vertical or leftward gesture.
    if(dx<0 || Math.abs(dy)>Math.abs(dx)*1.5){
      tracking=false;
    }
  }

  window.addEventListener('touchstart',e=>{
    if(e.touches&&e.touches.length)start(e.touches[0].clientX,e.touches[0].clientY,e.target);
  },{passive:true,capture:true});

  window.addEventListener('touchmove',e=>{
    if(e.touches&&e.touches.length)move(e.touches[0].clientX,e.touches[0].clientY,e);
  },{passive:false,capture:true});

  window.addEventListener('touchend',()=>{
    tracking=false;
  },{passive:true,capture:true});

  window.addEventListener('touchcancel',()=>{
    tracking=false;
  },{passive:true,capture:true});
})();
</script>
